version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
    - gosec
    - bodyclose
    - errname
    - nilerr
    - unconvert
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true

  govet:
    enable:
      - shadow

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  revive:
    rules:
      - name: exported
      - name: package-comments
      - name: var-naming
      - name: unused-parameter